name: Docker Security Scan

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  docker-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Scan Dockerfile config
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'config'
          scan-ref: '.'
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'

      - name: Build Docker image
        run: docker build -t local-scan-image:${{ github.sha }} .

      - name: Scan built Docker image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'local-scan-image:${{ github.sha }}'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          scanners: 'vuln'
          vuln-type: 'os,library'
          severity: 'CRITICAL'
